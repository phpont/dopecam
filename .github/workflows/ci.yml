name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOFTCAM_COMMIT: e89a699ed9932c74f57afe4f396be89665967e00
  DOPECAM_CLSID: E53F2A16-5A12-44CE-A198-862D4BF84725

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build DopeCam
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S .\windows -B .\build\windows -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

          cmake --build .\build\windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

          if (-not (Test-Path .\build\windows\Release\DopeCam.exe)) {
              throw "DopeCam.exe was not generated"
          }

          if (-not (Test-Path .\build\windows\Release\DopeCamDirectShowCheck.exe)) {
              throw "DopeCamDirectShowCheck.exe was not generated"
          }

      - name: Build pinned DirectShow backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Root = Join-Path $env:RUNNER_TEMP "dopecam-softcam"
          git clone --quiet https://github.com/tshino/softcam.git $Root
          git -C $Root checkout --quiet $env:SOFTCAM_COMMIT

          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $SoftcamCpp = Join-Path $Root "src\softcam\softcam.cpp"
          $Text = [IO.File]::ReadAllText($SoftcamCpp).Replace("`r`n", "`n")

          $Text = $Text.Replace(
              'const wchar_t FILTER_NAME[] = L"DirectShow Softcam";',
              'const wchar_t FILTER_NAME[] = L"DopeCam";'
          )

          $OldGuid = "DEFINE_GUID(CLSID_DShowSoftcam,`n0xaef3b972, 0x5fa5, 0x4647, 0x95, 0x71, 0x35, 0x8e, 0xb4, 0x72, 0xbc, 0x9e);"
          $NewGuid = "DEFINE_GUID(CLSID_DShowSoftcam,`n0xe53f2a16, 0x5a12, 0x44ce, 0xa1, 0x98, 0x86, 0x2d, 0x4b, 0xf8, 0x47, 0x25);"
          $Text = $Text.Replace($OldGuid, $NewGuid)

          [IO.File]::WriteAllText($SoftcamCpp, $Text, $Utf8NoBom)

          $SenderCpp = Join-Path $Root "src\softcamcore\SenderAPI.cpp"
          $Text = [IO.File]::ReadAllText($SenderCpp)
          $Text = $Text.Replace(
              "if (0.0f < framerate)",
              "if (false && 0.0f < framerate)"
          )
          [IO.File]::WriteAllText($SenderCpp, $Text, $Utf8NoBom)

          $FrameBufferCpp = Join-Path $Root "src\softcamcore\FrameBuffer.cpp"
          $Text = [IO.File]::ReadAllText($FrameBufferCpp)
          $Text = $Text.Replace(
              'const char NamedMutexName[] = "DirectShow Softcam/NamedMutex";',
              'const char NamedMutexName[] = "DopeCam/NamedMutex";'
          )
          $Text = $Text.Replace(
              'const char SharedMemoryName[] = "DirectShow Softcam/SharedMemory";',
              'const char SharedMemoryName[] = "DopeCam/SharedMemory";'
          )
          [IO.File]::WriteAllText($FrameBufferCpp, $Text, $Utf8NoBom)

          msbuild "$Root\src\softcam\softcam.vcxproj" `
              /m `
              /t:Rebuild `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:PlatformToolset=v143 `
              /nologo `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "DirectShow backend build failed"
          }

          $Candidates = @(
              (Join-Path $Root "dist\bin\x64\softcam.dll"),
              (Join-Path $Root "src\softcam\dist\bin\x64\softcam.dll"),
              (Join-Path $Root "src\softcam\x64\Release\softcam.dll")
          )

          $Dll = $Candidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

          if (-not $Dll) {
              throw "softcam.dll was not found after build"
          }

          Copy-Item $Dll .\build\windows\Release\DopeCamVirtualCamera.dll -Force

      - name: Upload Windows CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: dopecam-windows-x64
          path: |
            build/windows/Release/DopeCam.exe
            build/windows/Release/DopeCamDirectShowCheck.exe
            build/windows/Release/DopeCamVirtualCamera.dll

  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK: $SDK"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at: $SDKMANAGER"
            find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            >/dev/null
          test -f "$SDK/platforms/android-36/android.jar"
          test -d "$SDK/build-tools/36.0.0"
          echo "ANDROID_SDK_GATE=PASS"

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          gradle -p android clean :app:assembleDebug --no-daemon
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: dopecam-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
